# Docs site config. Build/serve with mkdocs (pip install mkdocs mkdocs-material):
#   mkdocs serve      # live preview at http://127.0.0.1:8000
#   mkdocs build      # static site into ./site
# The pages are plain Markdown under docs/ and render fine on GitHub too, so this
# generator is swappable (Docusaurus/etc.) — it just defines the nav.
site_name: Kinova Gen3 Low-Level Driver
site_description: Durable C++17 driver for Kinova Gen3 7-DOF low-level control at 1 kHz — joint torque, Cartesian and joint impedance, position and velocity modes, on a PREEMPT_RT Jetson
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Control Modes: guide/control-modes.md
      - Gripper: guide/gripper.md
      - Arbitration: guide/arbitration.md
      - Streaming: guide/streaming.md
  - Reference:
      - API: reference/api.md
  - Deep Dive:
      - Cartesian Impedance: deep-dive/impedance.md
      - Trajectory Interpolation: deep-dive/trajectory-interpolation.md
      - Velocity-Mode Twist Map: deep-dive/velocity-mode.md
  - Operations:
      - Real-Time Tuning: rt-tuning.md
      - Integration Runbook: integration-runbook.md
